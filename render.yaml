# Render Blueprint for the Gist backend (deploys from lifeofstephanie/Recall).
# Two web services in one repo:
#   - gist-ai       (Python/FastAPI, ONNX embeddings)   → ./ai
#   - gist-gateway  (Node/Express)                      → ./gateway
# Secrets (sync: false) must be filled in from the Render dashboard.
services:
  # ── AI microservice ──────────────────────────────────────────────
  - type: web
    name: gist-ai
    runtime: python
    plan: free
    rootDir: ai
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='sentence-transformers/all-MiniLM-L6-v2')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LANCE_TABLE_NAME
        value: movie_quotes
      # ── Secrets — set these in the Render dashboard ──
      - key: LANCE_DB_URI
        sync: false
      - key: LANCE_API_KEY
        sync: false

  # ── Gateway API ──────────────────────────────────────────────────
  - type: web
    name: gist-gateway
    runtime: node
    plan: free
    rootDir: gateway
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TMDB_BASE_URL
        value: https://api.themoviedb.org/3
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      # ── Secrets — set these in the Render dashboard ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      # Public URL of the gist-ai service above, e.g.
      # https://gist-ai.onrender.com  (no trailing slash)
      - key: AI_SERVICE_URL
        sync: false
      - key: RESET_PASSWORD_URL
        sync: false
